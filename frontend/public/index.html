<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#3a3632" />
        <meta
            name="description"
            content="C.S. Singhi & Associates — 25 years of architecture in the Himalayas. Gangtok, Sikkim."
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap"
        />
        <title>C.S. Singhi & Associates — 25 Years of Himalayan Architecture</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <!-- SVG filter that converts the logo PNG's luminance to alpha,
             so its baked-in black background renders as fully transparent. -->
        <svg width="0" height="0" style="position:absolute" aria-hidden="true">
            <filter id="lum-alpha" color-interpolation-filters="sRGB">
                <feColorMatrix type="matrix" values="
                    1.05 0    0    0  0
                    0    1.05 0    0  0
                    0    0    1.05 0  0
                    0.62 0.62 0.62 0  0
                "/>
            </filter>
        </svg>
        <div id="progress-bar"></div>
        <div id="root"></div>
    </body>
</html>
